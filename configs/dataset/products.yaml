dataset_name : products

source:
  format : csv
  path : data/landing/olist_products_dataset.csv
  delimiter : ","
  header : true

destination:
  format : parquet
  path : data/bronze/products
  mode : overwrite

schema :
  module : src.schemas.bronze.products_schema
  variable : PRODUCT_SCHEMA

partition:
  enabled : false
  columns : []

quality:
  required_columns :
    - product_id
    - product_category_name
    - product_name_lenght
    - product_description_lenght
    - product_photos_qty
    - product_weight_g
    - product_length_cm
    - product_height_cm
    - product_width_cm
  key_columns : 
    - product_id

metadata:
  add_ingestion_timestamp : true
  add_source_file : true
  add_pipeline_name : true