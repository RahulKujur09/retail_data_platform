dataset_name : orders

source:
  format : csv
  path : data/landing/olist_orders_dataset.csv
  delimiter : ","
  header : true

destination:
  format : parquet
  path : data/bronze/orders
  mode : overwrite

schema :
  module : src.schemas.bronze.orders_schema
  variable : ORDERS_SCHEMA

partition:
  enabled : false
  columns : []

quality:
  required_columns :
    - order_id
    - customer_id
    - order_status
    - order_purchase_timestamp
    - order_approved_at
    - order_delivered_carrier_date
    - order_delivered_customer_date
    - order_estimated_delivery_date
  key_columns : 
    - order_id

metadata:
  add_ingestion_timestamp : true
  add_source_file : true
  add_pipeline_name : true