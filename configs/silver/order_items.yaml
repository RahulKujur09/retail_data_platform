dataset_name : order_items

source :
  format : parquet
  path : data/bronze/order_items

destination:
  format : parquet
  path : data/silver/order_items
  mode : overwrite

transformation:
  module : src.transformation.silver.order_items
  function : transform

partition:
  enabled : false
  columns : []

quality:
  required_columns :
    - order_id
    - order_item_id
    - product_id
    - seller_id
    - shipping_limit_date
    - price
    - freight_value
  key_columns : 
    - order_id
    - order_item_id