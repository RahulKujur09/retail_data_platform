dataset_name : products

source : 
  format : parquet
  path : data/bronze/products

destination :
  format : parquet
  path : data/silver/products
  mode : overwrite

transformation:
  module: src.transformation.silver.products
  function : transform

partition:
  enabled : false
  columns : []

quality:
  required_columns :
    - product_id
    - product_category_name
    - product_name_lenght
    - product_description_lenght
    - product_photos_qty
    - product_weight_g
    - product_length_cm
    - product_height_cm
    - product_width_cm
  key_columns : 
    - product_id